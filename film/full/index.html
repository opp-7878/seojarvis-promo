<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SEO Jarvis — полный ролик</title>
<style>
@font-face { font-family: "InterF"; src: url(../assets/fonts/inter-cyrillic-opsz-normal.woff2) format("woff2"); font-weight: 100 900;
  unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "InterF"; src: url(../assets/fonts/inter-latin-opsz-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "MonoF"; src: url(../assets/fonts/jetbrains-mono-cyrillic-wght-normal.woff2) format("woff2"); font-weight: 100 800;
  unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "MonoF"; src: url(../assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 100 800; }
:root { --sans: "InterF", sans-serif; --mono: "MonoF", monospace; --blue: #1A69F0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; container-type: inline-size; background: #000; }
#bg { position: absolute; inset: 0;
  background:
    radial-gradient(60% 55% at 50% 105%, rgba(26,105,240,.55), transparent 70%),
    radial-gradient(40% 40% at 85% 0%, rgba(26,105,240,.18), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8.333%),
    #000; }
#bgPulse { position: absolute; inset: 0; background: radial-gradient(50% 45% at 50% 100%, rgba(26,105,240,.5), transparent 70%); opacity: 0; }
.scene { position: absolute; inset: 0; display: none; }
.abs { position: absolute; left: 0; top: 0; }
.t { position: absolute; font-family: var(--sans); font-weight: 800; color: #fff; letter-spacing: -.035em; line-height: 1.04; white-space: nowrap; }
.t .b { color: var(--blue); }
.wd, .lt { display: inline-block; white-space: pre; transform-origin: 0 70%; }
.fillw { background: linear-gradient(90deg, #1A69F0 0 46%, #fff 54% 100%); background-size: 220% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.mono { font-family: var(--mono); }
.win { position: absolute; border-radius: 1.1cqw; overflow: hidden; border: 1px solid rgba(255,255,255,.18); background: #fff;
  box-shadow: 0 .4cqw 1cqw rgba(0,0,0,.5), 0 3cqw 6cqw rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.6); transform-origin: 50% 50%; }
.win > img { display: block; width: 100%; height: auto; }
.win.fill > img { height: 100%; object-fit: cover; object-position: top left; }
.win.contain > img { height: 100%; object-fit: contain; object-position: center; }
.win .sh { position: absolute; inset: 0; background: #05070e; opacity: 0; pointer-events: none; }
.win .ov { position: absolute; left: 0; top: 0; pointer-events: none; }
.ring { position: absolute; border-radius: .6cqw; box-shadow: 0 0 0 .3cqw #1A69F0, 0 0 2cqw rgba(26,105,240,.7); pointer-events: none; }
.toast { position: absolute; display: flex; align-items: center; gap: 1cqw; font: 600 1.5cqw/1 var(--sans); color: #0c1220; background: #fff; border-radius: 1cqw;
  padding: 1cqw 1.6cqw 1cqw 1cqw; box-shadow: 0 1.5cqw 3cqw rgba(0,0,0,.6); white-space: nowrap; transform-origin: 0 50%; z-index: 30; }
.toast img { width: 2.4cqw; height: 2.4cqw; display: block; }
.mascot { position: absolute; left: 0; top: 0; transform-origin: 50% 90%; filter: drop-shadow(0 0 2.4cqw rgba(26,105,240,.55)); }
.glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(26,105,240,.5), transparent 65%); }
#cursor { position: absolute; left: 0; top: 0; width: 2.4cqw; z-index: 100; filter: drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.5)); transform-origin: 10% 8%; }
#ripple { position: absolute; left: 0; top: 0; width: 4cqw; height: 4cqw; margin: -2cqw 0 0 -2cqw; border-radius: 50%; border: .3cqw solid rgba(26,105,240,.95);
  box-shadow: 0 0 2cqw rgba(26,105,240,.8); z-index: 99; }
#flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff, #6ba5ff 35%, rgba(26,105,240,.0) 75%); opacity: 0; z-index: 90; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 200; }

/* auth */
.auth { position: absolute; background: #fff; border-radius: 1.4cqw; padding: 2.2cqw; color: #0c1220; font-family: var(--sans);
  box-shadow: 0 3cqw 6cqw rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.15); }
.auth h5 { font: 800 2.3cqw/1.1 var(--sans); letter-spacing: -.03em; }
.auth .s { font-size: 1.05cqw; color: #5b6475; margin-top: .5cqw; }
.auth .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: .4cqw; background: #f1f5fd; border-radius: .9cqw; padding: .35cqw; margin-top: 1.4cqw; }
.auth .tabs .pillbg { position: absolute; left: .35cqw; top: .35cqw; height: 2.6cqw; border-radius: .7cqw; background: #fff; box-shadow: 0 .1cqw .4cqw rgba(16,42,88,.12); }
.auth .tabs span { position: relative; display: flex; align-items: center; justify-content: center; gap: .5cqw; height: 2.6cqw; font: 600 1cqw/1 var(--sans); color: #8c96ad; }
.auth label { display: block; font: 500 1cqw/1 var(--sans); color: #5b6475; margin: 1.3cqw 0 .6cqw; }
.auth .in { display: flex; align-items: center; gap: .8cqw; height: 3.2cqw; border: .12cqw solid #1A69F0; box-shadow: 0 0 0 .35cqw rgba(26,105,240,.12); border-radius: .9cqw; padding: 0 1cqw; font: 500 1.25cqw/1 var(--sans); }
.auth .caret { display: inline-block; width: .1cqw; height: 1.5cqw; background: #1A69F0; margin-left: .1cqw; }
.auth .go { display: flex; align-items: center; justify-content: center; height: 3.2cqw; border-radius: .9cqw; margin-top: 1.2cqw; color: #fff; font: 600 1.2cqw/1 var(--sans); background: linear-gradient(90deg,#3a78dd,#1450c8); }
.auth .or { display: flex; align-items: center; gap: 1cqw; margin: 1.4cqw 0 1.1cqw; font: 400 .95cqw/1 var(--sans); color: #8c96ad; white-space: nowrap; }
.auth .or::before, .auth .or::after { content: ""; flex: 1; height: 1px; background: #e2e8f3; }
.auth .soc { display: grid; grid-template-columns: repeat(3,1fr); gap: .8cqw; }
.auth .ob { position: relative; display: flex; align-items: center; justify-content: center; gap: .7cqw; height: 3.4cqw; border: .12cqw solid #dde4f0; border-radius: 1cqw; font: 600 1.1cqw/1 var(--sans); color: #0c1220; background: #fff; }
.auth .ob img { width: 1.8cqw; height: 1.8cqw; display: block; flex: none; }
.auth .ob .hlr { position: absolute; inset: -.12cqw; border-radius: 1cqw; border: .12cqw solid #1A69F0; box-shadow: 0 0 0 .3cqw rgba(26,105,240,.22), 0 0 2.4cqw rgba(26,105,240,.55); opacity: 0; }

/* drum */
.drum { position: absolute; left: 46cqw; top: 0; display: flex; align-items: center; gap: 1cqw; white-space: nowrap; font: 600 1.9cqw/1 var(--sans); color: #1d2433;
  background: #fff; border-radius: 999px; padding: 1.1cqw 2cqw 1.1cqw 1.1cqw; transform-origin: 0 50%; }
.drum .num { position: relative; width: 3.2cqw; height: 2.3cqw; flex: none; }
.drum em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 1.2cqw/1 var(--mono); font-style: normal; color: #fff; background: #1A69F0; border-radius: 999px; }
.drum .ok { position: absolute; left: .4cqw; top: 0; width: 2.4cqw; height: 2.4cqw; opacity: 0; }
.drum .lab { display: inline-block; }
.drum .gl { position: absolute; inset: 0; border-radius: 999px; box-shadow: 0 0 0 .35cqw #1A69F0, 0 0 4cqw rgba(26,105,240,.7); opacity: 0; }
.flynum { position: absolute; left: 0; top: 0; font: 600 1.2cqw/1 var(--mono); color: #fff; background: #1A69F0; border-radius: 999px; padding: .55cqw .7cqw; }
.morph { position: absolute; left: 0; top: 0; background: #fff; box-shadow: 0 3cqw 6cqw rgba(0,0,0,.6); }
.mhead { position: absolute; left: 2.4cqw; top: 2.2cqw; display: flex; align-items: center; gap: .7cqw; background: rgba(255,255,255,.92); color: #0c1220; border-radius: 999px;
  padding: .45cqw 1.1cqw .45cqw .45cqw; z-index: 40; box-shadow: 0 .6cqw 2cqw rgba(0,0,0,.5); transform-origin: 0 50%; }
.mhead em { font: 600 .85cqw/1 var(--mono); font-style: normal; color: #fff; background: var(--blue); border-radius: 999px; padding: .45cqw .55cqw; }
.mhead b { font: 700 1.15cqw/1 var(--sans); letter-spacing: -.01em; white-space: nowrap; display: inline-block; }
.dots { position: absolute; right: 2.4cqw; top: 3cqw; display: flex; gap: .45cqw; z-index: 40; }
.dots i { width: .7cqw; height: .7cqw; border-radius: 50%; background: rgba(255,255,255,.22); }
.dots i.on { background: #1A69F0; box-shadow: 0 0 .8cqw #1A69F0; }
.dots i.done { background: #3ddc84; }
.card6 { position: absolute; padding: 1.6cqw; font-family: var(--sans); }
.btnp { font: 600 1.9cqw/1 var(--sans); color: #fff; background: #1A69F0; border-radius: 999px; padding: 1.3cqw 2.4cqw; box-shadow: 0 0 3cqw rgba(26,105,240,.6); position: relative; overflow: hidden; display: inline-block; }
.btng { font: 600 1.9cqw/1 var(--sans); color: #fff; border: .15cqw solid rgba(255,255,255,.35); border-radius: 999px; padding: 1.2cqw 2.3cqw; display: inline-block; }
.sheen { position: absolute; top: -20%; bottom: -20%; width: 30%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="fdefs"></defs></svg>
<div id="stage">
  <div id="bg"></div><div id="bgPulse"></div>
  <div id="scenes"></div>
  <div id="flash"></div>
  <div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  <div id="fade"></div>
</div>
<script src="full.js"></script>
</body>
</html>
